<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<meta name="robots" content="noindex,nofollow">
<title>VEGAS · Termos Digitais</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--bd:#2a2f3a;--tx:#e8eaed;--mut:#9aa0ab;
--gold:#d4a12a;--green:#2fae66;--red:#e0574a;--blue:#3d7fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h1,h2,h3{margin:0 0 10px}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.5px}.brand span{color:var(--gold)}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.top nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.top nav button.on{background:var(--card2);color:var(--tx)}
.who{font-size:12px;color:var(--mut);white-space:nowrap}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat .v{font-size:26px;font-weight:800;margin-top:4px}
.stat .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:0;border-color:var(--gold)}
.btn{background:var(--gold);color:#16181d;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 8px;border-bottom:1px solid var(--bd)}
td{padding:11px 8px;border-bottom:1px solid #22262f;vertical-align:middle}
tr:hover td{background:#1b1f27}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.t-PENDENTE{background:#3a2f12;color:#e3b64a}.t-ACESSADO{background:#12303a;color:#57bede}
.t-ASSINADO{background:#12301f;color:#5ad18c}.t-CANCELADO{background:#2b2b2b;color:#9aa0ab}
.t-EXPIRADO{background:#3a1a16;color:#e8796b}
.mut{color:var(--mut)}.sm{font-size:12px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:40}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:760px;width:100%}
.doc{background:#fff;color:#111;border-radius:10px;padding:22px;font:13px/1.55 Cambria,Georgia,serif;max-height:340px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1}
.login{max-width:380px;margin:9vh auto}
.linkbox{background:var(--card2);border:1px dashed var(--bd);border-radius:10px;padding:10px;word-break:break-all;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #22262f;font-size:13px}
.kv span{color:var(--mut)}.kv b{text-align:right}
/* PDF já baixado: botão azul-acinzentado com ✓ e linha levemente destacada */
.btn.baixado{background:#22344d;color:#9cc3f5;border:1px solid #37557d}
tr.baixado td{background:rgba(61,127,214,.07)}
tr.baixado:hover td{background:rgba(61,127,214,.13)}
/* Exclusão em 2 cliques: 1º clique arma, 2º confirma */
.btn.del{background:transparent;color:var(--red);border:1px solid #5a2a25}
.btn.del.armado{background:var(--red);color:#fff;border-color:var(--red);animation:pulsa .8s infinite alternate}
@keyframes pulsa{from{opacity:1}to{opacity:.7}}
.legenda{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:10px;flex-wrap:wrap}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.ev{font-size:12px;color:var(--mut);padding:6px 0;border-bottom:1px solid #22262f}

/* ================= LOGIN FUTURISTA ================= */
.lg{--n0:#03060d;--n1:#071226;--neon:#2f8bff;--neon2:#7cc4ff;--steel:#c9d3e0;--glass:rgba(10,20,40,.62);
  position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse 80% 60% at 50% 38%,#0d2350 0%,var(--n1) 38%,var(--n0) 80%);
  color:#e9f1ff;font-family:"Exo 2",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;z-index:10}
.lg *{box-sizing:border-box}
.lg-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
/* piso em grade com perspectiva */
.lg-floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;
  background-image:linear-gradient(rgba(47,139,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(47,139,255,.35) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:50% 0;
  -webkit-mask:linear-gradient(to bottom,transparent 0%,#000 30%,#000 70%,transparent 100%);mask:linear-gradient(to bottom,transparent 0%,#000 30%,#000 70%,transparent 100%);
  animation:lgDrift 14s linear infinite;opacity:.55}
@keyframes lgDrift{to{background-position:0 64px,0 0}}
/* horizonte iluminado */
.lg-horizon{position:absolute;left:0;right:0;top:56%;height:2px;background:linear-gradient(90deg,transparent,var(--neon) 20%,#bfe0ff 50%,var(--neon) 80%,transparent);
  box-shadow:0 0 18px 4px rgba(47,139,255,.55),0 0 80px 20px rgba(47,139,255,.18)}
/* molduras metálicas angulares nos cantos */
.lg-frame{position:absolute;width:46vw;height:46vh;filter:drop-shadow(0 0 10px rgba(47,139,255,.8))}
.lg-frame::before,.lg-frame::after{content:"";position:absolute;inset:0}
.lg-frame.tl{top:0;left:0}.lg-frame.br{bottom:0;right:0;transform:rotate(180deg)}
.lg-frame::before{background:linear-gradient(135deg,#5b6678,#1a202b 40%,#9aa7ba 60%,#1b222d);
  clip-path:polygon(0 0,62% 0,56% 7%,9% 7%,0 22%)}
.lg-frame::after{background:var(--neon);clip-path:polygon(9% 7.6%,56% 7.6%,55.4% 8.4%,9.6% 8.4%,0 24%,0 22.6%)}
/* feixes de luz */
.lg-beam{position:absolute;width:2px;height:140vh;top:-20vh;background:linear-gradient(transparent,var(--neon2),transparent);
  box-shadow:0 0 14px 3px rgba(47,139,255,.6);opacity:.55;transform:rotate(38deg)}
.lg-beam.b1{left:8%}.lg-beam.b2{left:16%;opacity:.25}.lg-beam.b3{right:10%;transform:rotate(38deg)}.lg-beam.b4{right:18%;opacity:.25}
.lg-glow{position:absolute;width:60vmax;height:60vmax;left:50%;top:40%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(47,139,255,.22),transparent 60%);animation:lgPulse 6s ease-in-out infinite alternate}
@keyframes lgPulse{from{opacity:.6}to{opacity:1}}
.lg-dust{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#9fd0ff,transparent),radial-gradient(1px 1px at 70% 20%,#9fd0ff,transparent),
  radial-gradient(1.5px 1.5px at 85% 60%,#9fd0ff,transparent),radial-gradient(1px 1px at 35% 75%,#9fd0ff,transparent),radial-gradient(1px 1px at 55% 45%,#cfe6ff,transparent),
  radial-gradient(1px 1px at 12% 85%,#9fd0ff,transparent),radial-gradient(1.5px 1.5px at 92% 15%,#cfe6ff,transparent);opacity:.7}

.lg-stage{position:relative;min-height:100%;display:grid;grid-template-columns:1fr minmax(320px,400px) 1fr;grid-template-rows:1fr auto;
  align-items:center;gap:24px 40px;padding:40px 4vw 28px}
/* coluna da marca */
.lg-brand{justify-self:center;text-align:center;max-width:360px}
.lg-shield{width:min(270px,22vw);display:block;margin:0 auto;mix-blend-mode:screen;
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 62%,transparent 72%);mask:radial-gradient(circle at 50% 50%,#000 62%,transparent 72%);
  filter:drop-shadow(0 0 30px rgba(47,139,255,.35))}
.lg-sub{font-family:Michroma,"Exo 2",sans-serif;font-size:12px;letter-spacing:.32em;color:var(--steel);margin:10px 0 34px}
.lg-h1{font-family:Michroma,"Exo 2",sans-serif;margin:0;line-height:1.05;text-align:left}
.lg-h1 small{display:block;font-size:clamp(18px,2.2vw,30px);letter-spacing:.12em;font-weight:400;color:#dfe8f5}
.lg-h1 b{display:block;font-size:clamp(30px,3.8vw,52px);letter-spacing:.04em;
  background:linear-gradient(180deg,#ffffff 0%,#c3cfdf 48%,#7d8ba0 52%,#e6edf6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(47,139,255,.45))}
.lg-rule{height:2px;width:70%;margin:14px 0;background:linear-gradient(90deg,var(--neon),transparent);box-shadow:0 0 10px var(--neon)}
.lg-tag{text-align:left;font-size:14px;letter-spacing:.08em;color:#cfd9e8;margin:0}

/* cartão de vidro */
.lg-card{position:relative;padding:30px 28px 22px;border-radius:18px;background:var(--glass);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(124,196,255,.35);
  box-shadow:0 0 0 1px rgba(47,139,255,.15) inset,0 0 40px rgba(47,139,255,.35),0 30px 80px rgba(0,0,0,.6);
  animation:lgIn .9s cubic-bezier(.2,.7,.2,1) both}
.lg-card::before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,#9fd0ff,rgba(47,139,255,.1) 30%,transparent 55%,rgba(47,139,255,.6) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes lgIn{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.lg-mark{display:block;width:230px;max-width:80%;margin:0 auto 18px;mix-blend-mode:screen;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);filter:brightness(1.05) contrast(1.15)}
.lg-markw{-webkit-mask:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(transparent,#000 14%,#000 86%,transparent);margin-bottom:18px}.lg-markw .lg-mark{margin-bottom:0}
.lg-title{display:flex;align-items:center;justify-content:center;gap:14px;font-family:Michroma,"Exo 2",sans-serif;font-size:15px;letter-spacing:.1em;margin:0}
.lg-title svg{width:36px;height:30px;color:#dbe7f7}
.lg-bar{height:2px;margin:12px auto 22px;width:70%;background:linear-gradient(90deg,transparent,var(--neon) 30%,var(--neon) 60%,rgba(255,255,255,.15) 60%,transparent);box-shadow:0 0 8px rgba(47,139,255,.8)}
.lg label{all:unset;display:block;font-size:12px;font-weight:600;letter-spacing:.08em;color:#d8e3f2;margin:14px 0 7px}
.lg-field{position:relative;display:flex;align-items:center}
.lg-field>svg{position:absolute;left:14px;width:17px;height:17px;color:#b8c7dc;pointer-events:none}
.lg input{all:unset;box-sizing:border-box;width:100%;padding:13px 44px 13px 44px;border-radius:10px;font-size:15px;color:#fff;
  background:rgba(6,14,30,.75);border:1px solid rgba(124,160,210,.28);transition:border-color .2s,box-shadow .2s}
.lg input::placeholder{color:#8696ad}
.lg input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(47,139,255,.22),0 0 18px rgba(47,139,255,.35)}
.lg-eye{all:unset;position:absolute;right:8px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:#b8c7dc}
.lg-eye:hover{color:#fff}.lg-eye:focus-visible{outline:2px solid var(--neon2)}
.lg-eye svg{width:18px;height:18px}
.lg-go{all:unset;box-sizing:border-box;width:100%;margin-top:24px;padding:14px;border-radius:10px;cursor:pointer;text-align:center;
  font-family:Michroma,"Exo 2",sans-serif;font-size:14px;letter-spacing:.12em;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#2f8bff,#0b4fd1);border:1px solid #6fb2ff;
  box-shadow:0 0 22px rgba(47,139,255,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:box-shadow .2s,transform .1s}
.lg-go:hover{box-shadow:0 0 34px rgba(47,139,255,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.lg-go:active{transform:translateY(1px)}.lg-go:focus-visible{outline:2px solid #fff;outline-offset:3px}
.lg-go:disabled{opacity:.6;cursor:default}
.lg-go svg{width:18px;height:18px}
.lg-err{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13px;color:#ffd2cc;background:rgba(224,87,74,.14);border:1px solid rgba(224,87,74,.45)}
.lg-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid rgba(124,160,210,.18);
  font-size:11px;letter-spacing:.12em;color:#93a3ba}
.lg-foot svg{width:13px;height:13px}

/* leitor de crachá à direita */
.lg-reader{justify-self:end;align-self:stretch;display:flex;align-items:center}
.lg-reader img{height:min(560px,72vh);mix-blend-mode:screen;-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);filter:drop-shadow(0 0 24px rgba(47,139,255,.35))}

/* faixa de ícones */
.lg-feats{grid-column:1/-1;justify-self:center;display:flex;gap:0;margin:0;padding:0;list-style:none}
.lg-feats li{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 34px;font-size:11px;letter-spacing:.14em;color:#c4d1e4}
.lg-feats li+li{border-left:1px solid rgba(124,160,210,.3)}
.lg-feats svg{width:28px;height:28px;color:#e6eef9;filter:drop-shadow(0 0 6px rgba(47,139,255,.8))}

@media(max-width:1100px){.lg-stage{grid-template-columns:1fr minmax(320px,400px)}.lg-reader{display:none}}
@media(max-width:760px){
  .lg-stage{grid-template-columns:1fr;padding:24px 16px;gap:22px}
  .lg-brand{order:-1}.lg-shield{width:120px}.lg-sub{margin-bottom:0;font-size:10px}.lg-h1,.lg-rule,.lg-tag{display:none}
  .lg-feats li{padding:4px 12px;font-size:9px}.lg-feats svg{width:22px;height:22px}
  .lg-frame{width:80vw;height:26vh}}
@media(prefers-reduced-motion:reduce){.lg-floor,.lg-glow,.lg-card{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   CONFIGURAÇÃO — cole aqui a URL /exec da implantação do Apps Script
   ==================================================================== */
const API = "https://script.google.com/macros/s/AKfycbwiMnrScRK2ujw791cupBHVtjeZA2w7XW5ElmpXSJzSDD7-gUEORZDZivpiLvVqQzjB3A/exec";

const S={tk:null,nome:"",cfg:null,rota:"dash"};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)}
function busy(b,txt){if(!b)return;b.disabled=true;b._o=b.textContent;b.textContent=txt||"Aguarde..."}
function free(b){if(!b)return;b.disabled=false;if(b._o)b.textContent=b._o}

/* text/plain evita preflight CORS no Apps Script */
async function api(acao, dados){
  let r;
  try{
    r = await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({acao},dados||{}))});
  }catch(e){ throw new Error("Sem conexão com o servidor."); }
  const j = await r.json();
  if(!j.ok){
    if(j.erro==="SESSAO_EXPIRADA"){ S.tk=null; sessionStorage.removeItem("vg_tk"); telaLogin("Sessão expirada. Entre novamente."); throw new Error("SESSAO_EXPIRADA"); }
    throw new Error(j.erro||"Falha na operação.");
  }
  return j.dados;
}
const apiRh=(acao,dados)=>api(acao,Object.assign({tk:S.tk},dados||{}));

function copiar(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .then(()=>toast("Link copiado"),()=>{
      const i=document.createElement("textarea");i.value=t;document.body.appendChild(i);i.select();
      document.execCommand("copy");i.remove();toast("Link copiado");
    });
}

/* Botão de PDF: muda de cor quando já foi baixado */
function botaoPdf(e, grande){
  const ja=!!e.pdfBaixadoEm, cls="btn"+(grande?"":" sm")+(ja?" baixado":"");
  const txt=ja?(grande?"✓ PDF já baixado":"✓ Baixado"):(grande?"Baixar PDF assinado":"PDF");
  const tit=ja?`Baixado em ${e.pdfBaixadoEm} por ${e.pdfBaixadoPor}`:"Baixar PDF assinado";
  return `<button class="${cls}" title="${esc(tit)}" data-em="${esc(e.pdfBaixadoEm||"")}" data-por="${esc(e.pdfBaixadoPor||"")}"
    data-grande="${grande?1:""}" onclick="baixarPdf('${e.id}',this)">${txt}</button>`;
}
/* Botão de excluir: primeiro clique pede confirmação, segundo exclui */
function botaoExcluir(e, grande){
  if(e.status==="ASSINADO") return "";
  return `<button class="btn del${grande?"":" sm"}" data-nome="${esc(e.nome)}" onclick="excluir('${e.id}',this)">Excluir</button>`;
}

async function novoLink(id){

  try{ const r=await apiRh("novoLink",{id}); copiar(r.link);
       document.querySelector(".mask")?.remove(); toast("Novo link gerado e copiado"); recarregar(); }
  catch(e){ falha(e) }
}
async function cancelar(id){
  const motivo=prompt("Motivo do cancelamento:"); if(motivo===null) return;
  try{ await apiRh("cancelar",{id,motivo}); document.querySelector(".mask")?.remove();
       toast("Link cancelado"); recarregar(); }
  catch(e){ falha(e) }
}
function recarregar(){ S.rota==="lista"?carregarLista():render(S.rota) }
async function baixarPdf(id,b){
  if(b.dataset.em && !confirm(`Este PDF já foi baixado em ${b.dataset.em} por ${b.dataset.por}.\n\nBaixar de novo?`)) return;
  busy(b,"...");
  try{
    const r=await apiRh("pdf",{id}); free(b); baixar(r.nome,r.base64);
    marcarBaixado(id);
  }catch(e){ falha(e,b) }
}
/* Pinta como baixado na hora, na lista e no detalhe, sem recarregar */
function marcarBaixado(id){
  const agora=new Date().toLocaleString("pt-BR");
  document.querySelectorAll(`button[onclick^="baixarPdf('${id}'"]`).forEach(x=>{
    x.classList.add("baixado"); x.dataset.em=agora; x.dataset.por=S.nome||"você";
    x.textContent=x.dataset.grande?"✓ PDF já baixado":"✓ Baixado"; x._o=x.textContent;
    x.title=`Baixado em ${agora}`;
  });
  document.getElementById("row-"+id)?.classList.add("baixado");
}
async function excluir(id,b){
  if(!b.classList.contains("armado")){          // 1º clique: pede confirmação
    b.classList.add("armado"); b.textContent="Confirmar exclusão?";
    b._t=setTimeout(()=>{ b.classList.remove("armado"); b.textContent="Excluir" },4000);
    return;
  }
  clearTimeout(b._t); busy(b,"Excluindo...");  // 2º clique: exclui
  try{
    await apiRh("excluir",{id,motivo:"enviado por engano"});
    document.querySelector(".mask")?.remove();
    toast(`Envio de ${b.dataset.nome} excluído`); recarregar();
  }catch(e){ b.classList.remove("armado"); falha(e,b); b.textContent="Excluir" }
}
function baixar(nome,b64){
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
  const a=document.createElement("a"); a.href=url; a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
